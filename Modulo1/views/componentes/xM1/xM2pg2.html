<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipos de Motores Hidráulicos</title>
    <link rel="stylesheet" href="../../../assets/css/M1/css_pg7.css">
</head>
<body>
    <div class="motor-course-container">

        <main class="motor-course-content">
            <section class="motor-intro-section">
                <p class="motor-intro-text">A continuación, se describen los tipos más comunes de motores hidráulicos, cada uno con características y aplicaciones específicas:</p>
                <div class="motor-params-grid">
                    <button class="motor-param-card" data-param="engranes">
                        <span class="motor-param-title">Motores de Engranes</span>
                    </button>
                    <button class="motor-param-card" data-param="paletas">
                        <span class="motor-param-title">Motores de Paletas</span>
                    </button>
                    <button class="motor-param-card" data-param="pistones">
                        <span class="motor-param-title">Motores de Pistones</span>
                    </button>
                </div>
            </section>

            <section class="motor-detail-section" id="detailSection">
                <div class="motor-detail-content" id="detailContent"></div>
                <div class="motor-navigation">
                    <button class="motor-nav-btn motor-prev-btn" id="prevBtn">Anterior</button>
                    <button class="motor-nav-btn motor-next-btn" id="nextBtn">Siguiente</button>
                </div>
            </section>
            <div style="margin-bottom: 80px;"></div>
        </main>
    </div>

    <script src="../../../js/M2/js_pg2.js"></script>
</body>
</html>
