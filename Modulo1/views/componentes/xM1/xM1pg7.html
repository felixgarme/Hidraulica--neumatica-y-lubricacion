<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parámetros de un Motor Hidráulico</title>
    <link rel="stylesheet" href="../../../assets/css/M1/css_pg7.css">
</head>
<body>
    <div class="motor-course-container">

        <main class="motor-course-content">
            <section class="motor-intro-section">
                <p class="motor-intro-text">Existen algunos aspectos importantes que han de comentarse para entender perfectamente el funcionamiento de los motores hidráulicos. Estos corresponden a:</p>
                <div class="motor-params-grid">
                    <button class="motor-param-card" data-param="cilindrada">
                        <span class="motor-param-title">Cilindrada</span>
                    </button>
                    <button class="motor-param-card" data-param="par">
                        <span class="motor-param-title">Par motor</span>
                    </button>
                    <button class="motor-param-card" data-param="caida">
                        <span class="motor-param-title">Caída de presión</span>
                    </button>
                    <button class="motor-param-card" data-param="potencia">
                        <span class="motor-param-title">Potencia</span>
                    </button>
                </div>
            </section>

            <section class="motor-detail-section" id="detailSection">
                <div class="motor-detail-content" id="detailContent"></div>
                <div class="motor-navigation">
                    <button class="motor-nav-btn motor-prev-btn" id="prevBtn">Anterior</button>
                    <button class="motor-nav-btn motor-next-btn" id="nextBtn">Siguiente</button>
                </div>
            </section>
            <div style="margin-bottom: 80px;"></div>
        </main>
    </div>

    <script src="../../../js/M1/js_pg7.js"></script>
</body>
</html>
