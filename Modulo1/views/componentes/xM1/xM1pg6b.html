<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor Hidráulico - Adaptable</title>
    <style>
        /* --- CAMBIOS PRINCIPALES --- */
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            /* Se eliminó display:flex y las propiedades de centrado */
        }

        .container {
            position: relative;
            /* Ahora el contenedor ocupa el 100% del alto y ancho */
            width: 100%; 
            height: 100%;
            
            /* Se eliminaron max-width, aspect-ratio, borde, sombra y radio */
            background-color: #ffffff;
            perspective: 800px;
        }
        
        /* El resto de los estilos no necesitan grandes cambios */

        .container svg {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .label {
            position: absolute;
            color: #333;
            text-align: center;
            line-height: 1.3;
            font-size: clamp(0.6rem, 2.5vw, 1.1rem); /* Ajuste ligero para mejor legibilidad */
        }

        #label1 {
            top: 5%;
            left: 4%;
            width: 30%;
        }
        #label2 {
            top: 30%;
            right: 3%;
            width: 33%;
          
        }

        /* --- ANIMACIONES (Sin cambios aquí) --- */
        
        @keyframes inject-fluid {
            0% { transform: translateY(0); opacity: 1; }
            50% { transform: translateY(40px); opacity: 1; }
            100% { transform: translateY(50px); opacity: 0; }
        }
        @keyframes rotate-3d-coin {
            from { transform: rotateX(0deg); }
            to { transform: rotateX(360deg); }
        }
        @keyframes rotate-2d {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        #fluid-arrow {
            animation: inject-fluid 3s ease-in-out infinite;
        }
        #rotor {
            transform-origin: 175px 150px; 
            animation: rotate-3d-coin 2.5s linear infinite;
            animation-delay: 0.5s;
        }
        #green-arrow-indicator {
            transform-origin: 312.5px 150px;
            animation: rotate-2d 2.5s linear infinite;
            animation-delay: 0.5s;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="label" id="label1">1. La inyección de fluido hidráulico...</div>
        <div class="label" id="label2">2. Provoca que la mecánica genere un giro sobre el eje...</div>

        <svg viewBox="0 0 400 300">
            <g id="static-parts">
                <circle cx="175" cy="150" r="60" stroke="#333" stroke-width="2.5" fill="none" />
                <rect x="165" y="210" width="20" height="15" stroke="#333" stroke-width="2.5" fill="none" />
                <rect x="235" y="140" width="50" height="20" stroke="#333" stroke-width="2.5" fill="none" />
                <line x1="285" y1="140" x2="285" y2="160" stroke="#333" stroke-width="2.5" />
            </g>
            <g id="green-arrow-indicator" stroke="green" stroke-width="2.5" fill="none">
                <path d="M 300 125 A 30 30 0 1 1 300 175" />
                <path d="M 295 170 L 300 175 L 305 170" />
            </g>
            <g id="fluid-arrow">
                 <line x1="175" y1="70" x2="175" y2="90" stroke="#555" stroke-width="2.5" />
                 <path d="M 170 85 L 175 95 L 180 85 Z" fill="#555" />
            </g>
            <g id="rotor">
                <path d="M 175 95 L 160 120 L 190 120 Z" fill="#333" />
                <path d="M 175 205 L 160 180 L 190 180 Z" fill="#333" />
            </g>
        </svg>
    </div>

</body>
</html>
