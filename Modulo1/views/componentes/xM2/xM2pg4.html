<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distribuidores Hidráulicos</title>
    <link rel="stylesheet" href="../../../assets/css/M2/css_pg4.css">
</head>
<body>
    <div class="motor-course-container">

        <main class="motor-course-content">
            <section class="motor-intro-section">
                <p class="motor-intro-text">A continuación, se describen los tipos más comunes de distribuidores hidráulicos y sus configuraciones de centro:</p>
                <div class="motor-params-grid">
                    <button class="motor-param-card" data-param="distribuidor4_2">
                        <span class="motor-param-title">Distribuidores 4/2</span>
                    </button>
                    <button class="motor-param-card" data-param="distribuidor4_3">
                        <span class="motor-param-title">Distribuidores 4/3</span>
                    </button>
                    <button class="motor-param-card" data-param="centroAbiertoPABT">
                        <span class="motor-param-title">Centro Abierto (PABT)</span>
                    </button>
                    <button class="motor-param-card" data-param="centroTandemPTAB">
                        <span class="motor-param-title">Centro Tándem (PT/A/B)</span>
                    </button>
                    <button class="motor-param-card" data-param="centroTandemPABT">
                        <span class="motor-param-title">Centro Tándem (P/ABT)</span>
                    </button>
                    <button class="motor-param-card" data-param="centroPAB_T">
                        <span class="motor-param-title">Centro PAB/T</span>
                    </button>
                    <button class="motor-param-card" data-param="otrasConfiguraciones">
                        <span class="motor-param-title">Otras Configuraciones</span>
                    </button>
                </div>
            </section>

            <section class="motor-detail-section" id="detailSection">
                <div class="motor-detail-content" id="detailContent"></div>
                <div class="motor-navigation">
                    <button class="motor-nav-btn motor-prev-btn" id="prevBtn">Anterior</button>
                    <button class="motor-nav-btn motor-next-btn" id="nextBtn">Siguiente</button>
                </div>
            </section>
            <div style="margin-bottom: 80px;"></div>
        </main>
    </div>

    <script src="../../../js/M2/js_pg4.js"></script>
</body>
</html>
